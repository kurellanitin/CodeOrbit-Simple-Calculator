
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaCalc - Simple Calculator</title>

    <!-- Connect the CSS stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Load JavaScript after the HTML is parsed -->
    <script src="script.js" defer></script>
</head>
<body>

    <main class="page">
        <header class="page-header">
            <a href="#" class="brand">Nova<span>Calc.</span></a>
            <p>Simple calculations. Smarter design.</p>
        </header>

        <section class="calculator" aria-label="Calculator">

            <!-- Calculator heading -->
            <div class="calculator-header">
                <div>
                    <span class="eyebrow">YOUR EVERYDAY TOOL</span>
                    <h1>Calculator</h1>
                </div>
                <div class="calculator-icon" aria-hidden="true">÷</div>
            </div>

            <!-- Display screen -->
            <div class="display" aria-label="Calculator display">
                <div class="display-label" id="display-label">
                    READY TO CALCULATE
                </div>

                <div
                    class="previous-value"
                    id="previous-value"
                    aria-live="polite">
                </div>

                <div
                    class="current-value"
                    id="display"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true">
                    0
                </div>
            </div>

            <!-- Calculator buttons -->
            <div class="buttons">

                <button class="btn utility" data-action="clear"
                        aria-label="Clear all">AC</button>

                <button class="btn utility" data-action="delete"
                        aria-label="Delete last digit">DEL</button>

                <button class="btn utility" data-action="sign"
                        aria-label="Change sign">+/-</button>

                <button class="btn operator" data-operator="/"
                        aria-label="Divide">÷</button>

                <button class="btn number" data-number="7">7</button>
                <button class="btn number" data-number="8">8</button>
                <button class="btn number" data-number="9">9</button>

                <button class="btn operator" data-operator="*"
                        aria-label="Multiply">×</button>

                <button class="btn number" data-number="4">4</button>
                <button class="btn number" data-number="5">5</button>
                <button class="btn number" data-number="6">6</button>

                <button class="btn operator" data-operator="-"
                        aria-label="Subtract">−</button>

                <button class="btn number" data-number="1">1</button>
                <button class="btn number" data-number="2">2</button>
                <button class="btn number" data-number="3">3</button>

                <button class="btn operator" data-operator="+"
                        aria-label="Add">+</button>

                <button class="btn number zero" data-number="0">0</button>
                <button class="btn number" data-action="decimal"
                        aria-label="Decimal point">.</button>

                <button class="btn equals" data-action="equals"
                        aria-label="Calculate result">=</button>

            </div>

            <div class="calculator-footer">
                <span class="footer-dot"></span>
                Ready for your next calculation
            </div>

        </section>

        <footer class="page-footer">
            <p>© <span id="year"></span> NovaCalc</p>
            <p>Built with HTML, CSS & JavaScript</p>
        </footer>
    </main>

</body>
</html>
